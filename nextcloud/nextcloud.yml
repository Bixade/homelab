services:
  nextcloud-db:
    image: postgres:17-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /appdata/nextcloud/db:/var/lib/postgresql/data
    mem_limit: 512m

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --save "" --maxmemory 128mb
    mem_limit: 192m

  nextcloud:
    image: nextcloud:31-apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    ports:
      - "8383:80"
    environment:
      TZ: Europe/Amsterdam
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_HOST}
      OVERWRITEHOST: ${NC_HOST}:10000
      OVERWRITEPROTOCOL: https
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 16G
    volumes:
      - /appdata/nextcloud/html:/var/www/html
      - /appdata/nextcloud/data:/var/www/html/data
    mem_limit: 1g
    labels:
      homepage.group: Personal
      homepage.name: Nextcloud
      homepage.icon: nextcloud.png
      homepage.href: http://mediaserver:8383

  nextcloud-cron:
    image: nextcloud:31-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - nextcloud
    volumes:
      - /appdata/nextcloud/html:/var/www/html
      - /appdata/nextcloud/data:/var/www/html/data
    mem_limit: 256m
