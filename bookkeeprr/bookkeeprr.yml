services:
  bookkeeprr:
    image: ghcr.io/paulcsiki/bookkeeprr:1.1.1
    container_name: bookkeeprr
    restart: unless-stopped
    user: "1000:100"
    ports:
      - "8484:3000"
    environment:
      TZ: Europe/Amsterdam
      BOOKKEEPRR_MEDIA_ROOT: /data/media
    volumes:
      - /appdata/bookkeeprr/config:/config
      - /srv/mergerfs/data:/data
