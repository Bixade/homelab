# qbittorrent
# qbittorrent/searxng/gluetun

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/Amsterdam
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24,172.16.0.0/12,100.64.0.0/10
    ports:
      - 8080:8080            # qBittorrent
      - 8888:8888            # SearXNG
    volumes:
      - /appdata/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /appdata/qbittorrent/config:/config
      - /srv/mergerfs/data:/data
    labels:
      - homepage.group=Media
      - homepage.name=qBittorrent
      - homepage.icon=qbittorrent.png
      - homepage.href=http://mediaserver:8080
    restart: unless-stopped
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    network_mode: "service:gluetun"   # searches go out through the VPN
    depends_on:
      - gluetun
    environment:
      - SEARXNG_PORT=8888
      - SEARXNG_BASE_URL=http://mediaserver:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      - /appdata/searxng:/etc/searxng
    labels:
      - homepage.group=Tools
      - homepage.name=SearXNG
      - homepage.icon=searxng.png
      - homepage.href=http://mediaserver:8888
      - homepage.description=Private search
    restart: unless-stopped
